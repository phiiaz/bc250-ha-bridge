# ESPHome configuration for Waveshare ESP32-S3-RLCD-4.2 (400x300 Monochrome RLCD)
# Acts as a desktop status monitor and Wake / Shut down remote for bc250-ha-bridge.
#
# Prerequisites in Home Assistant:
#   1. Add this device in the ESPHome integration.
#   2. Settings -> Devices & Services -> ESPHome -> Configure (on this device):
#      Check "Allow the device to perform Home Assistant actions".
#   3. Adjust the substitutions below if your entity IDs differ.

substitutions:
  device_name: bazzite-rlcd-remote
  friendly_name: Bazzite RLCD Remote

  # Home Assistant entity IDs from bc250-ha-bridge (adjust if renamed in HA)
  wol_button_entity: button.living_room_bazzite
  shutdown_button_entity: button.living_room_bazzite_bc_250_shut_down
  cpu_temp_entity: sensor.living_room_bazzite_bc_250_cpu_temperature
  gpu_temp_entity: sensor.living_room_bazzite_bc_250_gpu_temperature
  nvme_temp_entity: sensor.living_room_bazzite_bc_250_nvme_temperature
  gpu_clock_entity: sensor.living_room_bazzite_bc_250_gpu_clock
  gpu_load_entity: sensor.living_room_bazzite_bc_250_gpu_load
  pump_rpm_entity: sensor.living_room_bazzite_bc_250_pump_speed
  ram_used_entity: sensor.living_room_bazzite_bc_250_ram_used
  disk_used_entity: sensor.living_room_bazzite_bc_250_home_disk_used
  current_game_entity: sensor.living_room_bazzite_bc_250_current_steam_game

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Octal PSRAM is required on ESP32-S3-WROOM-1-N16R8 for the ST7305 display LUTs/buffer
psram:
  mode: octal
  speed: 40MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD
    components: [st7305_rlcd]
    refresh: 0s

# SPI bus for the 4.2" ST7305 RLCD (400x300)
# Note: Waveshare schematic uses GPIO11 (CLK) and GPIO12 (MOSI).
spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

# Shared I2C bus for onboard SHTC3 temp/humidity sensor (0x70) and PCF85063 RTC (0x51)
i2c:
  sda: GPIO13
  scl: GPIO14
  scan: true
  id: bus_a

globals:
  # true while waiting for a second KEY press to confirm Shut down
  - id: confirm_shutdown
    type: bool
    restore_value: no
    initial_value: "false"
  # Short status banner shown right after triggering Wake up or Shut down (0=none, 1=waking, 2=shutting_down)
  - id: action_feedback
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: disarm_confirmation
    mode: restart
    then:
      - delay: 5s
      - lambda: |-
          id(confirm_shutdown) = false;
      - component.update: rlcd_display

  - id: clear_feedback
    mode: restart
    then:
      - delay: 8s
      - lambda: |-
          id(action_feedback) = 0;
      - component.update: rlcd_display

# Side buttons on the Waveshare ESP32-S3-RLCD-4.2:
#   - KEY button (GPIO18): Wake up (when PC is offline) or Shut down with 2-press confirmation (when PC is online)
#   - BOOT button (GPIO0): Cancel shutdown confirmation, or force Wake-on-LAN
binary_sensor:
  - platform: gpio
    id: key_button
    name: "KEY Button"
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - if:
            condition:
              # Machine is considered online when cpu_temp has a valid state from MQTT
              lambda: "return !isnan(id(cpu_temp).state);"
            then:
              # Machine is ONLINE -> 2-step Shut down confirmation
              - if:
                  condition:
                    lambda: "return id(confirm_shutdown);"
                  then:
                    # Confirmed! Send Shut down command to Home Assistant
                    - script.stop: disarm_confirmation
                    - lambda: |-
                        id(confirm_shutdown) = false;
                        id(action_feedback) = 2;
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: ${shutdown_button_entity}
                    - component.update: rlcd_display
                    - script.execute: clear_feedback
                  else:
                    # First press: arm confirmation for 5 seconds
                    - lambda: |-
                        id(confirm_shutdown) = true;
                        id(action_feedback) = 0;
                    - component.update: rlcd_display
                    - script.execute: disarm_confirmation
            else:
              # Machine is OFFLINE -> Send Wake on LAN immediately
              - lambda: |-
                  id(confirm_shutdown) = false;
                  id(action_feedback) = 1;
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: ${wol_button_entity}
              - component.update: rlcd_display
              - script.execute: clear_feedback

  - platform: gpio
    id: boot_button
    name: "BOOT Button"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - if:
            condition:
              lambda: "return id(confirm_shutdown);"
            then:
              # Cancel pending shutdown confirmation
              - script.stop: disarm_confirmation
              - lambda: |-
                  id(confirm_shutdown) = false;
              - component.update: rlcd_display
            else:
              # Otherwise act as a dedicated Wake up button
              - lambda: |-
                  id(action_feedback) = 1;
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: ${wol_button_entity}
              - component.update: rlcd_display
              - script.execute: clear_feedback

sensor:
  # --- Onboard hardware sensors ---
  - platform: shtcx
    i2c_id: bus_a
    address: 0x70
    update_interval: 60s
    temperature:
      id: room_temp
      name: "Room Temperature"
    humidity:
      id: room_humidity
      name: "Room Humidity"

  - platform: adc
    id: bat_voltage
    name: "Battery Voltage"
    pin: GPIO4
    attenuation: 12db
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 60s
    filters:
      - multiply: 3.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: copy
    source_id: bat_voltage
    id: bat_level
    name: "Battery Level"
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      # Piecewise linear 18650 Li-ion discharge curve (3.2V = 0%, 4.15V+ = 100%)
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.20 -> 0.0
            - 3.50 -> 15.0
            - 3.65 -> 35.0
            - 3.75 -> 55.0
            - 3.85 -> 75.0
            - 4.00 -> 90.0
            - 4.15 -> 100.0
      - clamp:
          min_value: 0.0
          max_value: 100.0

  # --- Bazzite BC-250 sensors from Home Assistant ---
  - platform: homeassistant
    id: cpu_temp
    entity_id: ${cpu_temp_entity}
    on_value:
      - component.update: rlcd_display
  - platform: homeassistant
    id: gpu_temp
    entity_id: ${gpu_temp_entity}
  - platform: homeassistant
    id: nvme_temp
    entity_id: ${nvme_temp_entity}
  - platform: homeassistant
    id: gpu_clock
    entity_id: ${gpu_clock_entity}
  - platform: homeassistant
    id: gpu_load
    entity_id: ${gpu_load_entity}
  - platform: homeassistant
    id: pump_rpm
    entity_id: ${pump_rpm_entity}
  - platform: homeassistant
    id: ram_used
    entity_id: ${ram_used_entity}
  - platform: homeassistant
    id: disk_used
    entity_id: ${disk_used_entity}

text_sensor:
  - platform: homeassistant
    id: current_game
    entity_id: ${current_game_entity}
    on_value:
      - component.update: rlcd_display

font:
  - file: "gfonts://Inter@700"
    id: font_title
    size: 20
  - file: "gfonts://Inter@700"
    id: font_value
    size: 22
  - file: "gfonts://Inter@600"
    id: font_medium
    size: 15
  - file: "gfonts://Inter@400"
    id: font_small
    size: 12

display:
  - platform: st7305_rlcd
    id: rlcd_display
    model: WAVESHARE_400X300
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    rotation: 0
    update_interval: 10s
    lambda: |-
      const int W = it.get_width();   // 400
      const int H = it.get_height();  // 300
      const bool online = !isnan(id(cpu_temp).state);

      // Clear background (COLOR_OFF = White, COLOR_ON = Black)
      it.fill(COLOR_OFF);

      // =====================================================================
      // 1. HEADER BAR (y: 0..36)
      // =====================================================================
      it.filled_rectangle(0, 0, W, 36, COLOR_ON);
      it.print(12, 8, id(font_title), COLOR_OFF, "BAZZITE BC-250");

      // Status pill in header
      if (online) {
        it.filled_rectangle(190, 8, 66, 20, COLOR_OFF);
        it.print(223, 18, id(font_small), COLOR_ON, TextAlign::CENTER, "ONLINE");
      } else {
        it.rectangle(190, 8, 66, 20, COLOR_OFF);
        it.print(223, 18, id(font_small), COLOR_OFF, TextAlign::CENTER, "OFFLINE");
      }

      // Room temp & battery percentage on right side of header
      if (!isnan(id(room_temp).state) && !isnan(id(bat_level).state)) {
        it.printf(W - 10, 18, id(font_small), COLOR_OFF, TextAlign::CENTER_RIGHT,
                  "%.1fC  BAT %.0f%%", id(room_temp).state, id(bat_level).state);
      } else if (!isnan(id(bat_level).state)) {
        it.printf(W - 10, 18, id(font_small), COLOR_OFF, TextAlign::CENTER_RIGHT,
                  "BAT %.0f%%", id(bat_level).state);
      }

      // =====================================================================
      // 2. GAME / SESSION BANNER (y: 42..76)
      // =====================================================================
      it.rectangle(10, 42, W - 20, 34, COLOR_ON);
      if (!online) {
        it.print(20, 59, id(font_medium), COLOR_ON, TextAlign::CENTER_LEFT,
                 "Status: Machine is asleep or off");
      } else if (id(current_game).has_state() &&
                 id(current_game).state != "none" &&
                 id(current_game).state != "unavailable" &&
                 id(current_game).state != "unknown") {
        it.printf(20, 59, id(font_medium), COLOR_ON, TextAlign::CENTER_LEFT,
                  "Playing: %s", id(current_game).state.c_str());
      } else {
        it.print(20, 59, id(font_medium), COLOR_ON, TextAlign::CENTER_LEFT,
                 "Session: Ready (No active Steam game)");
      }

      // =====================================================================
      // 3. VITALS GRID (y: 82..240) - 3 columns x 2 rows
      // =====================================================================
      const int col_w = 122;
      const int row_h = 74;
      const int gap = 7;

      auto draw_tile = [&](int col, int row, const char* label, const char* val_str, float pct) {
        int x = 10 + col * (col_w + gap);
        int y = 82 + row * (row_h + gap);
        it.rectangle(x, y, col_w, row_h, COLOR_ON);
        it.print(x + 8, y + 6, id(font_small), COLOR_ON, label);
        it.print(x + 8, y + 24, id(font_value), COLOR_ON, val_str);

        // Optional progress bar at bottom of tile (if pct >= 0)
        if (pct >= 0.0f) {
          if (pct > 100.0f) pct = 100.0f;
          int bar_w = col_w - 16;
          int fill_w = (int)(bar_w * (pct / 100.0f));
          it.rectangle(x + 8, y + row_h - 14, bar_w, 7, COLOR_ON);
          if (fill_w > 0) {
            it.filled_rectangle(x + 8, y + row_h - 14, fill_w, 7, COLOR_ON);
          }
        }
      };

      char buf[24];

      // Tile (0,0): CPU Temp
      if (online && !isnan(id(cpu_temp).state)) {
        snprintf(buf, sizeof(buf), "%.1f C", id(cpu_temp).state);
        draw_tile(0, 0, "CPU TEMP", buf, id(cpu_temp).state);
      } else {
        draw_tile(0, 0, "CPU TEMP", "--", -1.0f);
      }

      // Tile (1,0): GPU Temp
      if (online && !isnan(id(gpu_temp).state)) {
        snprintf(buf, sizeof(buf), "%.1f C", id(gpu_temp).state);
        draw_tile(1, 0, "GPU TEMP", buf, id(gpu_temp).state);
      } else {
        draw_tile(1, 0, "GPU TEMP", "--", -1.0f);
      }

      // Tile (2,0): GPU Load
      if (online && !isnan(id(gpu_load).state)) {
        snprintf(buf, sizeof(buf), "%.0f %%", id(gpu_load).state);
        draw_tile(2, 0, "GPU LOAD", buf, id(gpu_load).state);
      } else {
        draw_tile(2, 0, "GPU LOAD", "--", -1.0f);
      }

      // Tile (0,1): GPU Clock
      if (online && !isnan(id(gpu_clock).state)) {
        snprintf(buf, sizeof(buf), "%.0f MHz", id(gpu_clock).state);
        float clk_pct = (id(gpu_clock).state - 1000.0f) / (2200.0f - 1000.0f) * 100.0f;
        if (clk_pct < 0.0f) clk_pct = 0.0f;
        draw_tile(0, 1, "GPU CLOCK", buf, clk_pct);
      } else {
        draw_tile(0, 1, "GPU CLOCK", "--", -1.0f);
      }

      // Tile (1,1): RAM Used
      if (online && !isnan(id(ram_used).state)) {
        snprintf(buf, sizeof(buf), "%.0f %%", id(ram_used).state);
        draw_tile(1, 1, "RAM USED", buf, id(ram_used).state);
      } else {
        draw_tile(1, 1, "RAM USED", "--", -1.0f);
      }

      // Tile (2,1): Pump RPM
      if (online && !isnan(id(pump_rpm).state)) {
        snprintf(buf, sizeof(buf), "%.0f RPM", id(pump_rpm).state);
        draw_tile(2, 1, "PUMP SPEED", buf, -1.0f);
      } else {
        draw_tile(2, 1, "PUMP SPEED", "--", -1.0f);
      }

      // =====================================================================
      // 4. BOTTOM ACTION BAR (y: 248..292) - WAKE UP / SHUT DOWN
      // =====================================================================
      const int bar_y = 248;
      const int bar_h = 42;

      if (id(action_feedback) == 1) {
        // Waking up feedback
        it.filled_rectangle(10, bar_y, W - 20, bar_h, COLOR_ON);
        it.print(W / 2, bar_y + bar_h / 2, id(font_medium), COLOR_OFF, TextAlign::CENTER,
                 "WAKE-ON-LAN PACKET SENT...");
      } else if (id(action_feedback) == 2) {
        // Shutting down feedback
        it.filled_rectangle(10, bar_y, W - 20, bar_h, COLOR_ON);
        it.print(W / 2, bar_y + bar_h / 2, id(font_medium), COLOR_OFF, TextAlign::CENTER,
                 "SHUTTING DOWN BAZZITE...");
      } else if (id(confirm_shutdown)) {
        // 2-step Shutdown confirmation prompt (inverted black bar)
        it.filled_rectangle(10, bar_y, W - 20, bar_h, COLOR_ON);
        it.print(W / 2, bar_y + 13, id(font_medium), COLOR_OFF, TextAlign::CENTER,
                 "CONFIRM SHUT DOWN?");
        it.print(W / 2, bar_y + 31, id(font_small), COLOR_OFF, TextAlign::CENTER,
                 "Press KEY again to confirm  |  Press BOOT to cancel");
      } else if (online) {
        // Normal Online state -> KEY arms Shut down
        it.rectangle(10, bar_y, W - 20, bar_h, COLOR_ON);
        it.rectangle(12, bar_y + 2, W - 24, bar_h - 4, COLOR_ON);
        it.print(W / 2, bar_y + bar_h / 2, id(font_medium), COLOR_ON, TextAlign::CENTER,
                 "[ Press KEY: Shut Down PC ]");
      } else {
        // Normal Offline state -> KEY triggers Wake up
        it.filled_rectangle(10, bar_y, W - 20, bar_h, COLOR_ON);
        it.print(W / 2, bar_y + bar_h / 2, id(font_medium), COLOR_OFF, TextAlign::CENTER,
                 "[ Press KEY: Wake Up PC ]");
      }
