# Bazzite BC-250 dashboard: a single custom card.
# Requires the card resource (see README -> Dashboard card): /hacsfiles/... (HACS) or /local/bc250-card.js.
#
# Install: Settings -> Dashboards -> Add dashboard -> "New dashboard from scratch", open it,
# three-dot menu -> Edit dashboard -> three-dot menu -> Raw configuration editor, paste, Save.
# Then edit the card and pick your "Bazzite BC-250" device (device_id), or use the card picker.
title: Bazzite
views:
  - title: Bazzite
    path: bazzite
    icon: mdi:controller
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:bc250-card
            device_id: REPLACE_WITH_YOUR_DEVICE_ID
            wol_entity: button.wake_on_lan   # <- your Wake on LAN button (optional)
            show_advanced: true
            glass: false
