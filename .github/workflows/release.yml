name: release

# Push a tag like v0.1.0 to publish a release. HACS reads the card from the latest
# release's assets, so bc250-card.js must be attached to it.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - name: Test and build
        working-directory: card
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Create release with the card attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bc250-card.js --title "$GITHUB_REF_NAME" --generate-notes
